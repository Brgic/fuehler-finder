<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fühler">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fühler-Finder</title>
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#1b1f1d; --muted:#6a716d; --line:#e2e5e0;
  --accent:#c2410c; --accent-soft:#fdeee5; --chip:#eef0ec; --ok:#0f766e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121413; --card:#1c1f1e; --ink:#eef1ee; --muted:#9aa29d; --line:#2c302e;
    --accent:#fb923c; --accent-soft:#3a2417; --chip:#262a28; --ok:#5eead4;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 6px;border-radius:10px;font:600 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.search:focus{border-color:var(--accent)}
main{padding:10px calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));max-width:760px;margin:0 auto}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:7px;color:var(--ink);font:inherit;cursor:pointer}
.item:active{transform:scale(.995)}
.item .t{font-weight:650;font-size:16px}
.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.item .hit{color:var(--accent);font-size:12.5px;margin-top:3px}
.back{border:0;background:none;color:var(--accent);font:600 15px system-ui;padding:4px 0;margin-bottom:6px;cursor:pointer}
.dh h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.chip b{font-weight:600}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin:8px 0}
.sensor{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.sh{display:flex;gap:10px;align-items:center;padding:12px 13px;cursor:pointer;width:100%;
  background:none;border:0;color:var(--ink);font:inherit;text-align:left}
.slot{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700}
.sh .r{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sh .n{font-weight:650;font-size:16px}
.sh .a{font-size:13px;color:var(--muted)}
.sh .q{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.sh .q b{display:block;color:var(--ink);font-size:15px}
.body{border-top:1px solid var(--line);padding:12px 13px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.calc label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.calc input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font-size:17px}
.res{grid-column:1/-1;font-size:15px;min-height:22px}
.res b{color:var(--accent);font-size:18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:14.5px}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;font-size:12.5px}
td:first-child,th:first-child{text-align:left}
tr.mark td{background:var(--accent-soft);font-weight:650}
.tw{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.desc{color:var(--muted);font-size:13.5px;margin:-2px 0 10px}
.empty{color:var(--muted);padding:20px 4px;text-align:center}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>

function valAt(t, T){
  const r = t.rows; if (!r.length) return null;

}

    const [a,va]=r[i],[b,vb]=r[i+1];
    if (va===vb) { if (V===va) out.push(a); continue; }
    const lo=Math.min(va,vb), hi=Math.max(va,vb);
    if (V>=lo && V<=hi){
      const T = a + (b-a)*(V-va)/(vb-va);
      if (!out.some(x=>Math.abs(x-T)<0.05)) out.push(T);
    }
  }
  return out;
}

/* ---------- lists ---------- */
function deviceList(){
  const q = norm($('#q').value);
  const res = [];
  DATA.devices.forEach((d,i)=>{
    if (!q){ res.push([i,null]); return; }
    if (norm(d.name).includes(q) || norm(d.art).includes(q) || norm(d.use).includes(q) || norm(d.conv).includes(q)){
      res.push([i,null]); return;
    }
    const s = d.sensors.find(s => norm(s.name).includes(q) || norm(s.art).includes(q));
    if (s) res.push([i,s]);
  });
  res.sort((x,y)=> (x[1]?1:0)-(y[1]?1:0));
  app.innerHTML = `<div class="count">${res.length} Steuergerät${res.length===1?'':'e'}</div>` +
    (res.length ? res.map(([i,s])=>{
      const d=DATA.devices[i];
      const sub=[d.art&&('Art. '+d.art), d.use].filter(Boolean).join(' · ');
      return `<button class="item" data-g="${i}"><div class="t">${esc(d.name)}</div>
        ${sub?`<div class="s">${esc(sub)}</div>`:''}
        ${s?`<div class="hit">Fühler: ${esc(s.name||s.art)} (${esc(s.role)})</div>`:''}</button>`;
    }).join('') : `<div class="empty">Nichts gefunden.</div>`);
}
function tableList(){
  const q = norm($('#q').value);
  const keys = Object.keys(DATA.tables).sort((a,b)=>a-b);
  const res = keys.filter(k => !q || norm('nr'+k).includes(q) || norm(k)===q || norm(tableTitle(k)).includes(q));
  app.innerHTML = `<div class="count">${res.length} Fühlertabellen</div>` +
    res.map(k=>{
      const t=DATA.tables[k], r=t.rows;
      return `<button class="item" data-t="${k}"><div class="t">Nr. ${k} · ${esc(tableTitle(k))}</div>
      <div class="s">${r.length?`${fmtT(r[0][0])} bis ${fmtT(r[r.length-1][0])} °C · ${U(t.unit)}`:''}</div></button>`;
    }).join('');
}

/* ---------- detail pieces ---------- */
function tableBlock(nr, id){
  const t = DATA.tables[nr];
  if (!t) return `<div class="note">${nr==='?'?'Fühlertabelle unbekannt.':`Fühlertabelle Nr. ${esc(nr)} ist in der Liste nicht vorhanden.`}</div>`;
  const u = U(t.unit), ex = t.extra;
  return `
    <div class="desc">Fühlertabelle Nr. ${esc(nr)} · ${esc(tableTitle(nr))}</div>
    <div class="calc" data-nr="${esc(nr)}" id="c${id}">
      <div><label>Temperatur °C</label><input inputmode="decimal" class="inT" placeholder="z. B. 20"></div>
      <div><label>Messwert ${u}</label><input inputmode="decimal" class="inV" placeholder="z. B. ${fmt(t.rows[Math.floor(t.rows.length/2)]?.[1])}"></div>
      <div class="res"></div>
    </div>
    ${t.notes.length?`<div class="note">${esc(t.notes.join(' '))}</div>`:''}
    <div class="tw"><table><thead><tr><th>°C</th><th>${u}</th>${ex?`<th>${esc(ex.label)}</th>`:''}</tr></thead><tbody>
    ${t.rows.map(([a,b])=>`<tr data-tt="${a}"><td>${fmtT(a)}</td><td>${fmt(b)}</td>${ex?`<td>${ex.map[a.toFixed(1)]!=null?ex.map[a.toFixed(1)]+' °C':''}</td>`:''}</tr>`).join('')}
    </tbody></table></div>`;
}
function wireCalc(box){
  const t = DATA.tables[box.dataset.nr]; if (!t) return;
  const res = box.querySelector('.res'), iT=box.querySelector('.inT'), iV=box.querySelector('.inV');
  const tw = box.parentElement.querySelector('.tw');
  const mark = T => {
    tw.querySelectorAll('tr.mark').forEach(r=>r.classList.remove('mark'));
    if (T==null) return;
    let best=null, bd=1e9;
    tw.querySelectorAll('tr[data-tt]').forEach(r=>{const d=Math.abs(+r.dataset.tt-T); if(d<bd){bd=d;best=r;}});
    if (best){ best.classList.add('mark'); tw.scrollTop = best.offsetTop - tw.clientHeight/2; }
  };
  const p = s => parseFloat(String(s).replace(/['’\s]/g,'').replace(',','.'));
  iT.addEventListener('input',()=>{
    iV.value=''; const T=p(iT.value);
    if (isNaN(T)){ res.innerHTML=''; mark(null); return; }
    const v=valAt(t,T);
    res.innerHTML = v==null ? `Ausserhalb der Tabelle (${fmtT(t.rows[0][0])} bis ${fmtT(t.rows.at(-1)[0])} °C)`
      : `${fmtT(T)} °C → <b>${fmt(v)} ${U(t.unit)}</b>`;
    mark(T);
  });
  iV.addEventListener('input',()=>{
    iT.value=''; const V=p(iV.value);
    if (isNaN(V)){ res.innerHTML=''; mark(null); return; }
    const ts=tempsAt(t,V);
    res.innerHTML = ts.length ? `${fmt(V)} ${U(t.unit)} → <b>${ts.map(x=>fmtT(x)+' °C').join(' oder ')}</b>`
      : `Wert liegt ausserhalb der Tabelle – Fühler oder Leitung prüfen`;
    mark(ts.length?ts[0]:null);
  });
}
function quick(nr){
  const t=DATA.tables[nr]; if(!t||!t.rows.length) return '';
  const v=valAt(t,20); if(v==null) return '';
  return `<div class="q">bei 20 °C<b>${fmt(v)} ${U(t.unit)}</b></div>`;
}

/* ---------- detail views ---------- */
function showDevice(i){
  const d = DATA.devices[i]; if(!d){ route(); return; }
  app.innerHTML = `
    <button class="back" data-back>‹ Zurück</button>
    <div class="dh"><h2>${esc(d.name)}</h2>
    <div class="meta">
      ${d.art?`<span class="chip">Art.-Nr. <b>${esc(d.art)}</b></span>`:''}
      ${d.use?`<span class="chip">Original: <b>${esc(d.use)}</b></span>`:''}
      ${d.conv?`<span class="chip">Umbau: <b>${esc(d.conv)}</b></span>`:''}
    </div></div>
    ${d.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}
    ${d.sensors.length?'':'<div class="empty">Keine Fühler eingetragen.</div>'}
    ${d.sensors.map((s,k)=>`
      <div class="sensor">
        <button class="sh" data-open="${k}">
          <div class="slot">${s.slot}</div>
          <div><div class="r">${esc(s.role)}</div><div class="n">${esc(s.name||'–')}</div>
          <div class="a">${s.art?'Art.-Nr. '+esc(s.art):''}${s.table?(s.art?' · ':'')+'Tabelle '+esc(s.table):' · keine Tabelle'}</div></div>
          ${quick(s.table)}
        </button>
        <div class="body" id="b${k}" hidden>${s.table?tableBlock(s.table,k):'<div class="note">Für diesen Fühler ist keine Fühlertabelle hinterlegt.</div>'}</div>
      </div>`).join('')}`;
  app.querySelectorAll('.calc').forEach(wireCalc);
  const first = d.sensors.findIndex(s=>DATA.tables[s.table]);
  if (d.sensors.length===1 || first===0) app.querySelector('#b'+(first<0?0:first))?.removeAttribute('hidden');
  window.scrollTo(0,0);
}
function showTable(nr){
  if(!DATA.tables[nr]){ route(); return; }
  const used = DATA.devices.map((d,i)=>[d,i]).filter(([d])=>d.sensors.some(s=>s.table===nr));
  app.innerHTML = `<button class="back" data-back>‹ Zurück</button>
    <div class="dh"><h2>Tabelle Nr. ${esc(nr)}</h2></div>
    <div class="sensor"><div class="body">${tableBlock(nr,'t')}</div></div>
    ${used.length?`<div class="count" style="margin-top:16px">Verwendet in ${used.length} Steuergerät${used.length===1?'':'en'}</div>`+
      used.map(([d,i])=>`<button class="item" data-g="${i}"><div class="t">${esc(d.name)}</div>
      <div class="s">${esc(d.sensors.filter(s=>s.table===nr).map(s=>s.role+': '+(s.name||'?')).join(' · '))}</div></button>`).join(''):''}`;
  app.querySelectorAll('.calc').forEach(wireCalc);
  window.scrollTo(0,0);
}

/* ---------- routing ---------- */
function setMode(m){
  mode=m; $('#tabG').classList.toggle('on',m==='g'); $('#tabT').classList.toggle('on',m==='t');
  $('#q').placeholder = m==='g' ? 'Gerät, Fühler oder Art.-Nr. suchen…' : 'Tabellen-Nr. oder Fühlertyp suchen…';
}
function route(){
  const h = location.hash.slice(1);
  let m;
  if ((m=h.match(/^g(\d+)$/))) { setMode('g'); showDevice(+m[1]); return; }
  if ((m=h.match(/^t(\d+)$/))) { setMode('t'); showTable(m[1]); return; }
  setMode(h==='tabellen'?'t':'g');
  $('#q').value = lastQ[mode];
  mode==='g'?deviceList():tableList();
}
const go = h => { if (location.hash==='#'+h) route(); else location.hash = h; };

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-g],[data-t],[data-open],[data-back]'); if(!b) return;
  if (b.dataset.g!=null) go('g'+b.dataset.g);
  else if (b.dataset.t!=null) go('t'+b.dataset.t);
  else if (b.dataset.back!=null){ history.length>1 ? history.back() : go(mode==='t'?'tabellen':'geraete'); }
  else { const el=app.querySelector('#b'+b.dataset.open); el.hidden=!el.hidden; }
});
$('#q').addEventListener('input',()=>{
  lastQ[mode]=$('#q').value;
  const listH = mode==='t'?'tabellen':'geraete';
  if (location.hash.slice(1)!==listH && location.hash!=='' ) { history.replaceState(null,'','#'+listH); }
  mode==='g'?deviceList():tableList();
});
$('#tabG').onclick=()=>go('geraete');
$('#tabT').onclick=()=>go('tabellen');
window.addEventListener('hashchange',route);
route();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
